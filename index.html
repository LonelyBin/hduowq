.links{display:flex;flex-direction:column;gap:12px}
.links a{height:56px;padding:0 16px;border-radius:16px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#000;font-size:15px;font-weight:500;position:relative;overflow:hidden}
.links a::before{content:"";position:absolute;inset:-3px;border-radius:18px;background:conic-gradient(red,orange,yellow,lime,cyan,blue,violet,red);animation:spin 3s linear infinite;z-index:0;filter:blur(0.5px) saturate(1.2)}
.links a::after{content:"";position:absolute;inset:3px;background:#fff;border-radius:14px;z-index:1}
.links a span{position:relative;z-index:2;display:flex;align-items:center;gap:12px}
.links a i{width:20px;text-align:center}
.links a>*{position:relative;z-index:2}
.links a:active{transform:scale(0.96)}
.ripple{position:absolute;width:20px;height:20px;background:rgba(0,0,0,0.08);border-radius:50%;transform:translate(-50%,-50%);animation:r .5s linear;z-index:3}
@keyframes r{to{width:220px;height:220px;opacity:0}}
